name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v3.3.1)
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Or whatever version is required
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build
        cd ..

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm build_tools/Layvix.spec
        
    # Create portable.txt so the exe uses local data folder
    - name: Setup Portable Data
      run: |
        New-Item -ItemType File -Path "dist/Layvix/portable.txt" -Force

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path dist\Layvix\* -DestinationPath dist\Layvix-Portable.zip

    - name: Compile Inno Setup Installer
      run: |
        # Remove portable.txt before building installer to prevent contamination
        Remove-Item -Path "dist/Layvix/portable.txt" -Force -ErrorAction SilentlyContinue
        # Ensure we pass the GitHub tag as the AppVersion (or a default)
        if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref }}".Replace("refs/tags/", "")
            $version = $tag.TrimStart('v')
        } else {
            $version = "1.0.0-dev"
        }
        iscc /DAppVersion=$version build_tools\LayvixSetup.iss
      shell: powershell

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/Layvix-Portable.zip
          installer/Layvix_Setup.exe
        generate_release_notes: true
